name: Agent CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-migration-smoke:
    name: Unit tests and migrated game smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crista_test
          POSTGRES_PASSWORD: crista_phase_b_test
          POSTGRES_DB: crista_phase_b
        options: >-
          --health-cmd "pg_isready -U crista_test -d crista_phase_b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://crista_test:crista_phase_b_test@127.0.0.1:5432/crista_phase_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s tests/test_core -p 'test_*.py'
      - run: python -m unittest discover -s tests/test_api -p 'test_*.py'
      - run: python -m unittest tests.test_db.test_migrate tests.test_db.test_schema_ownership tests.test_db.test_game_onboarding_integration
